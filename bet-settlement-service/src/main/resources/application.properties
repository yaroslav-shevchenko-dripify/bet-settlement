spring.application.name=bet-settlement-service

server.port=8082
server.servlet.context-path=/api/v1

spring.kafka.consumer.group-id=bet-settlement-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.betsettlement.model.message.EventOutcomeMessage

event-outcomes.topic=event-outcomes

rocketmq.name-server=localhost:9876
rocketmq.topic=bet-settlements
rocketmq.producer-group=bet-settlement-producer
rocketmq.consumer-group=bet-settlement-consumer
