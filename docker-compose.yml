services:
  event-outcome-service:
    build:
      context: .
      args:
        SERVICE: event-outcome-service
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  bet-settlement-service:
    build:
      context: .
      args:
        SERVICE: bet-settlement-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ROCKETMQ_NAME_SERVER: rocketmq:9876
    depends_on:
      - kafka
      - rocketmq

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  rocketmq:
    image: apache/rocketmq:5.5.0
    command: sh -c "sh mqnamesrv & sh mqbroker -n localhost:9876"
